# Publishes ghcr.io/dekopon-agents/cassette for linux/amd64 and linux/arm64 from the
# release's verified archives. Nothing is compiled: every Dockerfile instruction is a COPY, so one
# runner assembles both platforms, and the image is checked byte-for-byte against the archives
# before anything is pushed.
name: Container image

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag to package (for example v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    name: container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Stage the build context from the verified archives
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          work="$RUNNER_TEMP/image"
          context="$work/context"
          mkdir -p "$work/download" "$context"
          cp Dockerfile LICENSE-APACHE LICENSE-MIT "$context/"
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"
            archive="cassette-$version-${pair#*:}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work/download" \
              --pattern "$archive.tar.gz" --pattern "$archive.tar.gz.sha256"
            ( cd "$work/download" && sha256sum --check --strict "$archive.tar.gz.sha256" )
            gh attestation verify "$work/download/$archive.tar.gz" --repo "$GITHUB_REPOSITORY"
            tar -xzf "$work/download/$archive.tar.gz" -C "$work/download"
            mkdir -p "$context/dist/$arch"
            cp "$work/download/$archive/cassette" "$context/dist/$arch/"
          done
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build, verify and run both platforms locally
        shell: bash
        env:
          CONTEXT: ${{ steps.stage.outputs.context }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load --tag "cassette-proof:$arch" "$CONTEXT"
            container=$(docker create "cassette-proof:$arch")
            in_image=$(docker export "$container" | tar -xOf - usr/local/bin/cassette | sha256sum | cut -d' ' -f1)
            docker rm "$container" > /dev/null
            in_release=$(sha256sum "$CONTEXT/dist/$arch/cassette" | cut -d' ' -f1)
            if [ "$in_image" != "$in_release" ]; then
              echo "::error::$arch image binary $in_image differs from release $in_release"
              exit 1
            fi
          done
          docker run --rm cassette-proof:amd64 --version | grep -F "cassette ${TAG#v}"
          # PID1 must serve on the image's default listen address and exit cleanly on SIGTERM.
          id=$(docker run -d cassette-proof:amd64 replay --dir /tmp)
          sleep 3
          [ "$(docker inspect -f '{{.State.Running}}' "$id")" = true ]
          docker stop -t 10 "$id" > /dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$id")" = 0 ]
          docker logs "$id" 2>&1 | grep -F "cassette listening on http://0.0.0.0:8787"
          docker rm "$id" > /dev/null

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the manifest list
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.stage.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.stage.outputs.image }}:${{ inputs.tag }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Verify the published tag
        id: published
        shell: bash
        env:
          IMAGE: ${{ steps.stage.outputs.image }}
          BUILD_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}')
          platforms=$(jq -r '[.manifests[]?.platform | select(.architecture != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")' <<< "$manifest")
          [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "::error::platforms '$platforms'"; exit 1; }
          digest=$(jq -r .digest <<< "$manifest")
          [ "$digest" = "$BUILD_DIGEST" ] || { echo "::error::$digest != $BUILD_DIGEST"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$TAG\` at \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
