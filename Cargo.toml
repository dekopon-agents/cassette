[package]
name = "cassette"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Record/replay HTTP server for Dekopon provider baseUrl"
repository = "https://github.com/dekopon-agents/cassette"
homepage = "https://github.com/dekopon-agents/cassette"
authors = ["Dekopon contributors"]
publish = false

[dependencies]
base64 = "0.23.1"
bytes = "1.10.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "server-graceful", "tokio"] }
parking_lot = "0.12.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-service = "0.3.3"
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 4
